<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Подробнее о сериале</title>
    <style>
        body {
            background-image: url('/images/background.jpg');
            background-size: cover;
            background-attachment: fixed;
            background-repeat: no-repeat;
            font-weight: 900;
            text-shadow:
                -1px -1px 0 #000,
                1px -1px 0 #000,
                -1px  1px 0 #000,
                1px  1px 0 #000;
             color: #ffffff;
        }
        .hidden{
            display: none;
        }
        .error {
            color: red;
        }
    </style>
    <script>
        function logEvent(event) {
            const serialId = document.getElementById('serialId').value;
            fetch('/api/log', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/x-www-form-urlencoded',
                },
                body: new URLSearchParams({
                    'serialId': serialId,
                    'event': event
                })
            }).then(response => {
                if (!response.ok) {
                    console.error('Ошибка при логировании события:', response.statusText);
                }
            }).catch(error => {
                console.error('Ошибка при отправке запроса:', error);
            });
        }
        function toggleSeasonsAndDuration() {
            const seasonsAndDuration = document.getElementById('seasonsAndDuration');
            if (seasonsAndDuration.style.display === "none" || seasonsAndDuration.style.display === "") {
                seasonsAndDuration.style.display = "block";
                logEvent('просмотр количества сезонов и серий');
            } else {
                seasonsAndDuration.style.display = "none";
            }
        }
        function toggleDescription() {
            const description = document.getElementById('description');
            if (description.style.display === "none" || description.style.display === "") {
                description.style.display = "block";
                logEvent('просмотр описания');
            } else {
                description.style.display = "none";
            }
        }
        function watchEpisode() {
            logEvent('просмотр серии');
            location.href = '/api/serials/watchEpisode';
        }
        function validateAndSubmit() {
            const markInput = document.getElementById('mark');
            const mark = parseFloat(markInput.value);
            const errorMessage = document.getElementById('error-message');

            if (isNaN(mark) || mark < 0 || mark > 10) {
                errorMessage.textContent = "Пожалуйста, введите оценку от 0 до 10.";
                return false;
            } else {
                errorMessage.textContent = "";
                return true;
            }
        }
    </script>
</head>
<body>
<h1 th:text="${serial.getSerialName()}">Title</h1>
<hr>
<p style="text-decoration: underline">Жанры:</p>
<div th:each="genre : ${serial.getGenres()}">
    <p th:text="${genre}">
</div>
<input type="hidden" id="serialId" th:value="${serial.getId()}"/>
<button style="color: #000000" onclick="toggleSeasonsAndDuration()">Узнать число сезонов и продолжительность серии</button>

<div id="seasonsAndDuration" class="hidden" style="display: none;">
    <p>Число сезонов: <span th:text="${serial.getSeasonsNumber()}">Число сезонов отсутствует</span></p>
    <p>Продолжительность серии: <span th:text="${serial.getEpisodeDuration()}">Продолжительность серии отсутствует</span> мин</p>
</div>
<br>
<button style="color: #000000" onclick="toggleDescription()">Посмотреть описание</button>

<div id="description" class="hidden" style="display: none;">
    <span th:text="${serial.getDescription()}">Число сезонов отсутствует</span>
</div>
<br>

<button style="color: #000000" type="button" onclick="watchEpisode()" class="btn btn-primary">Смотреть эпизод</button>
<div th:if="${isAuthenticated}">
    <hr>
    <p>Смотрели сериал? Оцените</p>
    <form th:action="@{/api/ratings}" method="post" onsubmit="return validateAndSubmit();">
    <label title="mark">По шкале от 1 до 10:</label>
    <input type="text" id="mark" name="mark" required/>
    <input type="hidden" name="serialId" th:value="${serial.getId()}"/>
    <br>
    <span id="error-message" class="error"></span>
    <br>
    <input style="color: #000000" type="submit" value="Оценить!">
    </form>
</div>
</body>
</html>
